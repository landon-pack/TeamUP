name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: teamup
          CLOUDFLARE_R2_BUCKET_NAME: teamup-files

      - name: Sync production bindings into dist wrangler config
        run: node scripts/patch-dist-wrangler.mjs
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Apply D1 migrations
        run: npm run cf:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish Worker secrets
        run: |
          set -e
          printf '%s' "$AUTH_SECRET" | npx wrangler secret put AUTH_SECRET --config dist/server/wrangler.json
          if [ -n "${SITE_OWNER_EMAIL}" ]; then
            printf '%s' "$SITE_OWNER_EMAIL" | npx wrangler secret put SITE_OWNER_EMAIL --config dist/server/wrangler.json
          fi
          if [ -n "${GEMINI_API_KEY}" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config dist/server/wrangler.json
          fi
          if [ -n "${AI_CONFIG_ENCRYPTION_KEY}" ]; then
            printf '%s' "$AI_CONFIG_ENCRYPTION_KEY" | npx wrangler secret put AI_CONFIG_ENCRYPTION_KEY --config dist/server/wrangler.json
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SITE_OWNER_EMAIL: ${{ secrets.SITE_OWNER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_CONFIG_ENCRYPTION_KEY: ${{ secrets.AI_CONFIG_ENCRYPTION_KEY }}
